[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;touch-action:manipulation;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{background:var(--noise) 0 0/48px 48px, radial-gradient(120% 900px at 50% 0%, var(--bg2), var(--bg) 70%), var(--bg);color:var(--ink);font-family:var(--body);font-size:17.5px;line-height:1.5;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:env(safe-area-inset-top,0px) calc(var(--tab-h) + 28px + env(safe-area-inset-bottom,0px));overscroll-behavior-y:contain}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;box-shadow:inset 0 0 120px rgba(0,0,0,.35)}
.wrap{max-width:640px;margin:0 auto;position:relative;z-index:1}
h1,h2,h3{font-family:var(--display);font-weight:700;text-wrap:balance;margin:0;line-height:1.15;letter-spacing:.02em}
a{color:var(--wind)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px;border-radius:6px}
.muted{color:var(--muted)}
strong{color:var(--gold)}

/* gold-leaf frame used by cards, rows, tables */
.frame,.card,.row,.checks label,.tbl,details,.result,.search,.stage-nav button,.sheet{
  border:2px solid transparent;
  background:var(--noise) 0 0/48px 48px padding-box, linear-gradient(var(--surface),var(--surface)) padding-box,
    linear-gradient(160deg,var(--gold-hi),var(--gold-lo) 35%,var(--gold) 60%,var(--gold-lo)) border-box;
  box-shadow:var(--shadow)}

/* top app bar */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;height:var(--bar-h);display:flex;align-items:center;gap:8px;
  background:var(--noise) 0 0/48px 48px, linear-gradient(var(--bg2),var(--bg));
  margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px))) calc(-1 * max(16px,env(safe-area-inset-right,0px)));
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.appbar::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:3px;background:linear-gradient(90deg,transparent,var(--gold-lo) 10%,var(--gold-hi) 50%,var(--gold-lo) 90%,transparent)}
.appbar .ab-in{max-width:640px;margin:0 auto;width:100%;display:flex;align-items:center;gap:8px;min-width:0}
.icon-btn{width:44px;height:44px;border-radius:50%;border:2px solid var(--gold-lo);background:radial-gradient(circle at 50% 35%,var(--raised),var(--bg));display:grid;place-items:center;cursor:pointer;flex:none;color:var(--gold)}
.icon-btn:active{transform:scale(.95)}
.icon-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.ab-title{font-family:var(--display);font-size:20px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;color:var(--gold);text-shadow:0 1px 0 rgba(0,0,0,.4)}
.lvl-chip{flex:none;width:46px;height:46px;border-radius:50%;padding:0;cursor:pointer;display:grid;place-items:center;align-content:center;gap:0;
  border:2px solid var(--gold-hi);background:radial-gradient(circle at 50% 30%,#3a2a12,#120c06);color:#ffe39a;
  box-shadow:0 0 0 2px var(--gold-lo),0 0 12px rgba(226,179,80,.35);font-family:var(--display);font-weight:800;font-size:17px;line-height:1}
.lvl-chip small{font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:#d9b66a;font-weight:700;font-family:var(--display)}

/* action-bar tabs */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:15;
  background:var(--noise) 0 0/48px 48px, linear-gradient(#2a2016,#0d0a07);border-top:2px solid var(--gold-lo);box-shadow:0 -1px 0 var(--gold-hi) inset, 0 -8px 20px rgba(0,0,0,.4);
  padding:8px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabbar .tb-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tabbar button{border:0;background:transparent;padding:0;display:grid;justify-items:center;gap:4px;cursor:pointer;color:#c9b27f;font-family:var(--display);font-size:11.5px;font-weight:700;letter-spacing:.04em;min-height:56px}
.tabbar .slot{width:44px;height:44px;border-radius:7px;display:grid;place-items:center;
  border:2px solid #6b5326;background:radial-gradient(circle at 50% 30%,#3b2f22,#15100b);box-shadow:inset 0 0 0 1px #000, inset 0 -6px 10px rgba(0,0,0,.5)}
.tabbar svg{width:24px;height:24px;stroke:#d8c08a;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-current="page"]{color:#ffe39a}
.tabbar button[aria-current="page"] .slot{border-color:#ffd56b;box-shadow:0 0 0 1px #000,0 0 14px rgba(255,205,90,.55), inset 0 0 12px rgba(255,205,90,.35)}
.tabbar button[aria-current="page"] svg{stroke:#ffe8a8}
.tabbar button:active .slot{transform:scale(.93)}
.tabbar .pip{display:none}

/* screens and cards */
.screen{display:grid;gap:16px;padding-block:18px 8px}
.card{border-radius:10px;padding:16px;display:grid;gap:12px;position:relative}
.card h3,.panel h3{font-size:18px;color:var(--gold)}
.card h3::after,.panel h3::after{content:"";display:block;height:1px;margin-top:8px;background:linear-gradient(90deg,var(--gold),transparent)}
.eyebrow{font-family:var(--display);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--class);font-weight:700}
.label{font-family:var(--display);font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);font-weight:700;display:flex;align-items:center;gap:10px}
.label::before,.label::after{content:"";height:1px;flex:1;background:linear-gradient(90deg,transparent,var(--gold-lo))}
.label::after{background:linear-gradient(90deg,var(--gold-lo),transparent)}
.hero{display:grid;gap:6px;padding-top:6px;justify-items:center;text-align:center}
.hero .crest{width:74px;height:84px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.45))}
.hero h1{font-family:var(--deco);font-size:clamp(28px,8.4vw,38px);background:linear-gradient(180deg,var(--gold-hi),var(--gold) 55%,var(--gold-lo));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 rgba(0,0,0,.35))}
.hero p{max-width:34ch}

.levelcard{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px}
.step{width:52px;height:52px;border-radius:50%;border:2px solid var(--gold-lo);background:radial-gradient(circle at 50% 30%,var(--raised),var(--bg));font-size:26px;cursor:pointer;display:grid;place-items:center;color:var(--gold)}
.step:active{transform:scale(.94)}
.levelnum{text-align:center}
.levelnum output{display:block;font-family:var(--deco);font-size:58px;line-height:1;font-variant-numeric:tabular-nums;color:var(--gold);text-shadow:0 0 18px rgba(226,179,80,.25)}
.levelnum span{font-family:var(--display);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.kv{display:grid;grid-template-columns:6.6em 1fr;gap:10px;align-items:baseline}
.kv .k{font-family:var(--display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--class);font-weight:700}
.kv .v{min-width:0}

/* red panel buttons */
.btn{border-radius:6px;padding:13px 16px;font-family:var(--display);font-weight:700;letter-spacing:.06em;cursor:pointer;text-align:center;min-height:48px;font-size:15.5px}
.btn.primary{color:#ffe39a;text-shadow:0 1px 1px #000;border:2px solid #d9a63e;background:linear-gradient(180deg,#b3271a,#7a140b 55%,#5a0d06);box-shadow:inset 0 1px 0 rgba(255,200,150,.35),0 3px 8px rgba(0,0,0,.35)}
.btn.primary:active{background:linear-gradient(180deg,#8f1d12,#5a0d06)}
.btn.ghost{color:var(--gold);border:2px solid var(--gold-lo);background:linear-gradient(180deg,var(--raised),var(--surface))}
.btn.danger{background:var(--warn-bg);color:var(--warn);border:2px solid var(--warn)}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* quest log rows */
.list{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.row{width:100%;text-align:left;display:grid;grid-template-columns:3.7em 1fr auto;gap:12px;align-items:center;border-radius:8px;padding:14px;cursor:pointer}
.row:active{filter:brightness(1.08)}
.row.cur{box-shadow:var(--shadow),0 0 0 1px var(--gold-hi),0 0 16px rgba(226,179,80,.3)}
.row .n{font-family:var(--display);font-weight:800;font-size:16px;color:var(--gold);font-variant-numeric:tabular-nums;line-height:1.1;text-shadow:0 1px 0 rgba(0,0,0,.35)}
.row.d-grey .n{color:var(--d-grey)}.row.d-yellow .n{color:var(--d-yellow)}.row.d-orange .n{color:var(--d-orange)}.row.d-red .n{color:var(--d-red)}
.row .t{font-weight:700;display:block;font-family:var(--display);font-size:15.5px;letter-spacing:.02em}
.row .s{color:var(--muted);font-size:15px;display:block}
.row .chev{color:var(--gold);font-size:24px}
/* XP-bar progress */
.row>span:nth-child(2){display:block;min-width:0}
.bar{display:block;height:10px;border-radius:2px;margin-top:8px;overflow:hidden;border:1px solid #000;background:#120a1c;box-shadow:inset 0 1px 3px rgba(0,0,0,.6);position:relative}
.bar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(5% - 1px),rgba(0,0,0,.55) calc(5% - 1px) 5%);pointer-events:none}
.bar i{display:block;height:100%;background:linear-gradient(180deg,var(--xp2),var(--xp1));box-shadow:inset 0 1px 0 rgba(255,255,255,.3);transition:width .35s ease}

/* quest objectives */
.panel ul.checks,.screen ul.checks{padding-left:0}
.checks{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.checks label{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;border-radius:8px;padding:13px 12px;cursor:pointer;min-height:52px}
.checks input{appearance:none;width:24px;height:24px;margin:0;border:2px solid var(--gold-lo);border-radius:4px;display:grid;place-items:center;cursor:pointer;background:radial-gradient(circle at 50% 30%,var(--raised),var(--bg));box-shadow:inset 0 0 0 1px rgba(0,0,0,.5);transition:border-color .15s}
.checks input::after{content:"";width:7px;height:13px;border:solid var(--gold-hi);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px) scale(0);transition:transform .15s;filter:drop-shadow(0 0 3px rgba(255,210,100,.7))}
.checks input:checked{border-color:var(--gold-hi)}
.checks input:checked::after{transform:rotate(45deg) translate(-1px,-1px) scale(1)}
.checks .lv{display:inline-block;font-family:var(--display);font-size:12.5px;font-weight:800;color:var(--class);margin-right:6px;font-variant-numeric:tabular-nums;letter-spacing:.04em}
.checks label.on{filter:saturate(.6) brightness(.92)}
.checks label.on .txt{color:var(--muted)}
.checks label.on .txt::after{content:" Complete";font-family:var(--display);font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--done);margin-left:6px}

.lvgroup{display:grid;gap:8px;padding-top:6px}
.lvh{font-family:var(--display);font-size:15px;letter-spacing:.08em;color:var(--class);margin:6px 0 0;display:flex;align-items:center;gap:10px}
.lvh::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold-lo),transparent)}
.lvh span{color:var(--gold);font-size:12px;letter-spacing:.06em}
.lvgroup.here .lvh{color:var(--gold-hi)}
.dgline{margin:0;font-size:15.5px;color:var(--muted);padding-left:4px}
.gl{all:unset;display:inline;cursor:help;color:inherit;font:inherit;border-bottom:1.5px dotted var(--gold);-webkit-tap-highlight-color:transparent}
.gl:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
.row .when{display:block;font-size:13.5px;color:var(--class);font-family:var(--display);letter-spacing:.03em;margin-top:3px}
.howto{margin:0;padding-left:1.3em;display:grid;gap:8px}
.howto li::marker{color:var(--gold);font-family:var(--display);font-weight:700}
.lvmust{margin:0;padding-left:1.25em;display:grid;gap:8px}
.lvmust li::marker{color:var(--gold)}
/* stage detail tabs */
.seg{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--bar-h) + 3px);z-index:12;padding-block:8px;background:linear-gradient(var(--bg) 70%,transparent)}
.seg .seg-in{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.seg button{border:2px solid var(--gold-lo);border-radius:8px 8px 3px 3px;padding:9px 4px;font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.04em;cursor:pointer;min-height:44px;
  color:#e7c98a;background:linear-gradient(180deg,#5a1209,#2e0905);text-shadow:0 1px 1px #000}
.seg button[aria-selected="true"]{color:#ffe39a;border-color:#ffd56b;background:linear-gradient(180deg,#b3271a,#6e1209);box-shadow:0 0 10px rgba(255,200,90,.35)}
.swipe-hint{font-size:13px;color:var(--muted);text-align:center;font-style:italic}
.panel{display:grid;gap:16px;padding-block:8px}
.panel h3{margin-top:4px}
.panel p{margin:0;max-width:65ch}
.panel ul,.panel ol,.screen ul.plain,.screen ol.plain{margin:0;padding-left:1.3em;display:grid;gap:6px}
.panel ul li::marker{color:var(--gold)} .panel ol li::marker{color:var(--gold);font-family:var(--display);font-weight:700}
/* tooltip-style notes */
.note{background:var(--tip);border:1px solid var(--tip-line);border-radius:6px;padding:12px 14px;font-size:16.5px;box-shadow:0 0 0 1px #000,0 6px 16px rgba(0,0,0,.3)}
.note strong{color:var(--gold)}
.warn{background:var(--warn-bg);border:1px solid var(--warn);border-radius:6px;padding:12px 14px;font-size:16.5px;box-shadow:inset 3px 0 0 var(--rage)}
.warn strong{color:var(--warn)}
.tbl{overflow-x:auto;border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:15.5px}
th,td{text-align:left;vertical-align:top;padding:10px 12px;border-bottom:1px solid var(--line)}
th{font-family:var(--display);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);background:rgba(0,0,0,.18)}
tr:last-child td{border-bottom:0}
td:first-child{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--class)}
tr.here td{background:rgba(127,211,92,.12)}
details{border-radius:8px;padding:0 14px}
summary{cursor:pointer;padding-block:13px;font-family:var(--display);font-weight:700;color:var(--gold)}
details[open]{padding-bottom:12px}
details .tbl{border:0;border-radius:0;background:transparent;box-shadow:none}
.stage-nav{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.stage-nav button{border-radius:8px;padding:12px;cursor:pointer;text-align:left;min-width:0}
.stage-nav button:last-child{text-align:right}
.stage-nav small{display:block;font-family:var(--display);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--class);font-weight:700}
.stage-nav span{display:block;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--display);color:var(--gold)}

/* search */
.search{display:flex;align-items:center;gap:8px;border-radius:8px;padding:0 12px;min-height:52px}
.search svg{width:20px;height:20px;stroke:var(--gold);fill:none;stroke-width:2;flex:none}
.search input{border:0;background:transparent;font:inherit;color:inherit;flex:1;min-width:0;padding:12px 0;outline:none}
.result{width:100%;text-align:left;border-radius:8px;padding:12px 14px;cursor:pointer;display:grid;gap:2px}
.result small{font-family:var(--display);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--class);font-weight:700}
.result mark{background:rgba(226,179,80,.3);color:inherit;border-radius:2px}

/* progress ring */
.ring{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring svg{width:96px;height:96px;filter:drop-shadow(0 0 8px rgba(155,93,229,.35))}
.ring .big{font-family:var(--deco);font-size:32px;color:var(--gold)}

/* sheet + toast */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:30;opacity:0;transition:opacity .2s}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;border-radius:14px 14px 0 0;border-bottom:0;
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  transform:translateY(100%);transition:transform .22s ease}
.sheet.show{transform:none}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--gold-lo);margin:0 auto 10px}
.sheet{max-height:min(86vh,calc(100dvh - 40px));display:flex;flex-direction:column}
.sheet .sh-in{max-width:640px;width:100%;margin:0 auto;display:grid;gap:14px;align-content:start;overflow-y:auto;overscroll-behavior:contain;min-height:0;flex:1 1 auto;padding-right:6px;scrollbar-width:thin;scrollbar-color:var(--gold) transparent;transform:translateZ(0)}
.sheet .sh-in::-webkit-scrollbar{width:6px}
.sheet .sh-in::-webkit-scrollbar-thumb{background:linear-gradient(var(--gold-hi),var(--gold-lo));border-radius:3px}
.sheet .sh-foot{max-width:640px;width:100%;margin:0 auto;flex:none;padding-top:12px;border-top:1px solid var(--line)}
.sheet .sh-foot:empty{display:none}
.sheet .more{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));pointer-events:none;
  font-family:var(--display);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold-hi);text-shadow:0 1px 2px #000;
  padding:4px 12px;border-radius:999px;background:rgba(0,0,0,.55);border:1px solid var(--gold-lo);opacity:0;transition:opacity .2s}
.sheet .more.on{opacity:1}
.sheet h2,.sheet h3{color:var(--gold)}
.quick{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.quick button{border:2px solid var(--gold-lo);background:radial-gradient(circle at 50% 30%,var(--raised),var(--bg));border-radius:6px;padding:10px 0;font-family:var(--display);font-weight:800;cursor:pointer;font-variant-numeric:tabular-nums;color:var(--gold)}
.quick button.on{border-color:#ffd56b;color:#ffe39a;background:linear-gradient(180deg,#b3271a,#6e1209);box-shadow:0 0 10px rgba(255,200,90,.4)}
/* "quest complete" banner toast */
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + var(--bar-h) + 26px);transform:translate(-50%,-8px) scale(.96);opacity:0;z-index:40;pointer-events:none;
  font-family:var(--deco);font-size:19px;font-weight:700;color:#ffd75e;text-align:center;white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis;
  text-shadow:0 0 2px #000,0 2px 4px #000,0 0 18px rgba(255,190,60,.55);padding:10px 34px;
  background:radial-gradient(60% 100% at 50% 50%,rgba(0,0,0,.72),rgba(0,0,0,0));transition:opacity .25s,transform .25s}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1)}
.foot{color:var(--muted);font-size:14px;font-style:italic}
@media (prefers-reduced-motion:no-preference){ .enter{animation:enter .25s ease-out} @keyframes enter{from{transform:translateY(8px);opacity:.4}to{transform:none;opacity:1}}
  .slide-l{animation:sl .18s ease-out} .slide-r{animation:sr .18s ease-out}
  @keyframes sl{from{transform:translateX(24px)}to{transform:none}} @keyframes sr{from{transform:translateX(-24px)}to{transform:none}}
  .hero .crest .gust{animation:gust 6s ease-in-out infinite} @keyframes gust{0%,100%{transform:translateX(0)}50%{transform:translateX(3px)}} }
@media (prefers-reduced-motion:reduce){ .sheet,.scrim,.toast,.bar i{transition:none} }
</style>
</head>

const GL_RX=(()=>{ const all=[]; GLOSSARY.forEach((g,gi)=>g[1].split('|').forEach(w=>all.push([w,gi]))); all.sort((a,b)=>b[0].length-a[0].length);
  const q=w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return all.map(([w,gi])=>({gi, rx:new RegExp("(^|[^A-Za-z’'-])("+q(w)+")(?![A-Za-z])", /^[A-Z]/.test(w)?'':'i')})); })();
function gloss(html){ const used=new Set(); let n=0;
  return html.split(/(<[^>]+>)/).map(part=>{ if(part.charAt(0)==='<'||n>=3) return part; const toks=[];
    for(const {gi,rx} of GL_RX){ if(n>=3) break; if(used.has(gi)) continue; const m=part.match(rx); if(!m) continue;
      const at=m.index+m[1].length; toks.push([m[2],gi]); part=part.slice(0,at)+'\u0001'+(toks.length-1)+'\u0002'+part.slice(at+m[2].length); used.add(gi); n++; }
    return part.replace(/\u0001(\d+)\u0002/g,(_,k)=>'<button type="button" class="gl" data-g="'+toks[+k][1]+'">'+toks[+k][0]+'</button>'); }).join(''); }

function buildIndex(){

  TALENTS.forEach(t=>idx.push({t:'Lv '+rangeLabel(t[0],t[1])+': '+t[2]+'. '+t[3],src:'Talent',go:stageFor(t[0]).id,seg:1}));
  TRAIN.forEach(t=>idx.push({t:'Lv '+t[0]+': '+t[1]+(t[2]?'. '+t[2]:''),src:'Trainer',go:stageFor(t[0]).id,seg:1}));
  DUNGEONS.forEach(d=>idx.push({t:d[0]+' (levels '+rangeLabel(d[1],d[2])+', '+d[3]+')'+(d[4]?'. '+d[4]:''),src:'Dungeon',go:stageFor(d[1]).id,seg:0}));
  REF.forEach(r=>r.b.forEach(b=>{ const add=t=>idx.push({t:plain(t),src:r.t,go:r.id});
    if(['p','h','note','warn'].includes(b[0])) add(b[1]);
    if(['ul','ol'].includes(b[0])) b[1].forEach(add);
    if(b[0]==='check') b[2].forEach(x=>add(x[0]));
    if(b[0]==='table') b[2].forEach(row=>add(row.join(': ')));
    if(b[0]==='details') b[3].forEach(row=>add(row.join(': ')));
  }));
  GLOSSARY.forEach(g=>idx.push({t:g[0]+': '+g[2],src:'Glossary',go:'glossary'}));
  return idx;
}

    '<div class="btn-row"><button type="button" class="btn ghost" id="luOff">Stop pop-ups</button><button type="button" class="btn primary" id="luOk">Got it</button></div>';
  openSheet(body,()=>{ $('luOk').onclick=closeSheet; $('luOff').onclick=()=>{ store.set('sfw2.lvpop.off',true); closeSheet(); toast('Level pop-ups off'); };
    $('sheet').querySelectorAll('[data-lu]').forEach(b=>b.onclick=()=>{ closeSheet(); go(b.dataset.lu); }); });
}
/* ===== router ===== */
const TABS=['now','stages','lookup','progress'];
const TITLES={now:'Now',stages:'Stages',lookup:'Look up',progress:'Progress'};
let backTo='now';
function go(id, segIdx){ if(segIdx!==undefined){ seg=+segIdx; } else if(STAGES.some(s=>s.id===id)) seg=store.get('sfw2.seg.'+id,0);
  if(location.hash.slice(1)===id) route(); else location.hash=id; }
function route(soft){
  const id=location.hash.slice(1)||'now';
  const st=STAGES.find(s=>s.id===id), rf=REF.find(r=>r.id===id);
  const tab = TABS.includes(id) ? id : st ? 'stages' : rf ? 'lookup' : 'now';
  TABS.forEach(t=>$('tab-'+t).toggleAttribute('aria-current',false)); $('tab-'+tab).setAttribute('aria-current','page');
  $('backBtn').hidden = !(st||rf); $('lvlChipNum').textContent=level;
  let html;
  if(st){ $('abTitle').textContent=st.t; html=stageScreen(st); }
  else if(rf){ $('abTitle').textContent=rf.t; html='<section class="screen">'+refScreen(rf)+'</section>'; }
  else { $('abTitle').textContent=TITLES[tab]; html = tab==='stages'?stagesScreen(): tab==='lookup'?lookupScreen(): tab==='progress'?progressScreen(): nowScreen(); backTo=tab; }
  if(soft) html=html.replace(/class="(screen|panel) enter"/g,'class="$1"');
  const y=window.scrollY; $('app').innerHTML=html; window.scrollTo(0, soft?y:0); wire(st);
  store.set('sfw2.last', id);
}
function refresh(){ route(true); }
function wire(st){
  const app=$('app');
  app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go, b.dataset.seg));
  app.querySelectorAll('input[data-k]').forEach(inp=>inp.onchange=()=>{
    const k=inp.dataset.k; if(inp.checked) ticks[k]=1; else delete ticks[k]; store.set('sfw2.ticks',ticks);
    inp.closest('label').classList.toggle('on',inp.checked);
    const owner=ALL.find(c=>keysOf(c).includes(k)); if(owner){ const p=progress(owner); if(inp.checked && p.done===p.total) toast(owner.t+' complete'); }
    showFollow(inp);
    if(!st && (location.hash.slice(1)||'now')==='now' && inp.checked){ const li=inp.closest('li'); if(li){ li.style.transition='opacity .25s ease, transform .25s ease'; li.style.opacity='0'; li.style.transform='translateX(14px)'; } setTimeout(refresh,300); }
  });
  if($('howtoHide')) $('howtoHide').onclick=()=>{ store.set('sfw2.howto.hide',true); const h=$('howto'); if(h) h.remove(); toast('Kept in Before you play'); };
  if($('lvDown')){ $('lvDown').onclick=()=>{ setLevel(level-1); refresh(); }; $('lvUp').onclick=()=>{ const o=level; setLevel(level+1, !store.get('sfw2.lvpop.off',false)); refresh(); if(level>o) levelUpSheet(level); }; }
  if($('q')){ const q=$('q'); q.oninput=()=>{ lastQuery=q.value; store.set('sfw2.q',lastQuery); $('res').innerHTML=results(lastQuery); $('res').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go,b.dataset.seg)); }; }
  if($('resetBtn')) $('resetBtn').onclick=()=>openSheet('<h2 id="sheetTitle">Reset all progress?</h2><p style="margin:0">This clears every tick on this device. Your level stays.</p><div class="btn-row"><button type="button" class="btn ghost" id="rsNo">Keep it</button><button type="button" class="btn danger" id="rsYes">Reset</button></div>',
     ()=>{ $('rsNo').onclick=closeSheet; $('rsYes').onclick=()=>{ ticks={}; store.set('sfw2.ticks',ticks); closeSheet(); route(); toast('Progress reset'); }; });
  if(st){
    const setSeg=(n,dir)=>{ seg=(n+SEGS.length)%SEGS.length; store.set('sfw2.seg.'+st.id,seg);
      app.querySelectorAll('.seg button').forEach((b,j)=>b.setAttribute('aria-selected',j===seg));
      const p=$('panel'); p.className='panel '+(dir>0?'slide-l':'slide-r'); p.setAttribute('aria-labelledby','seg-'+seg); p.innerHTML=stagePanels(st)[seg];
      window.scrollTo({top:0}); wirePanel(st); };
    app.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{ const n=+b.dataset.seg; setSeg(n, n>seg?1:-1); });
    let sx=0, sy=0, tracking=false;
    const area=$('panel').parentElement;
    area.addEventListener('touchstart',e=>{ if(e.target.closest('.tbl')) { tracking=false; return; } const t=e.touches[0]; sx=t.clientX; sy=t.clientY; tracking=true; },{passive:true});
    area.addEventListener('touchend',e=>{ if(!tracking) return; tracking=false; const t=e.changedTouches[0]; const dx=t.clientX-sx, dy=t.clientY-sy;
      if(Math.abs(dx)>60 && Math.abs(dx)>Math.abs(dy)*1.5){ if(dx<0 && seg<SEGS.length-1) setSeg(seg+1,1); else if(dx>0 && seg>0) setSeg(seg-1,-1); } },{passive:true});
  }
}
function wirePanel(st){
  $('panel').querySelectorAll('input[data-k]').forEach(inp=>inp.onchange=()=>{
    const k=inp.dataset.k; if(inp.checked) ticks[k]=1; else delete ticks[k]; store.set('sfw2.ticks',ticks);
    inp.closest('label').classList.toggle('on',inp.checked);
    const p=progress(st); if(inp.checked && p.done===p.total) toast(st.t+' complete');
    showFollow(inp);
  });
  $('panel').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go, b.dataset.seg));
}
$('backBtn').onclick=()=>{ if(history.length>1) history.back(); else go(backTo); };
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>go(b.dataset.tab));
window.addEventListener('hashchange',()=>route());
/* resume where you left off */
let _saveT=0; const saveY=()=>{ try{ store.set('sfw2.y',{id:location.hash.slice(1)||'now',y:Math.round(window.scrollY)}); }catch(e){} };
window.addEventListener('scroll',()=>{ clearTimeout(_saveT); _saveT=setTimeout(saveY,250); },{passive:true});
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') saveY(); });
window.addEventListener('pagehide',saveY);
const _resume=(()=>{ if(location.hash) return null; const last=store.get('sfw2.last',''); if(!last||last==='now') return null;
  history.replaceState(null,'','#'+last); if(STAGES.some(s=>s.id===last)) seg=store.get('sfw2.seg.'+last,0); return last; })();
window.addEventListener('scroll',()=>$('appbar').classList.toggle('scrolled',window.scrollY>4),{passive:true});
document.addEventListener('click',e=>{ const g=e.target.closest('.gl'); if(!g) return; e.preventDefault(); e.stopPropagation();
  const it=GLOSSARY[+g.dataset.g]; if(!it) return;
  openSheet('<h2 id="sheetTitle">'+esc(it[0])+'</h2><p style="margin:0">'+esc(it[2])+'</p><div class="btn-row"><button type="button" class="btn ghost" id="glAll">Full glossary</button><button type="button" class="btn primary" id="glOk">Got it</button></div>',
    ()=>{ $('glOk').onclick=closeSheet; $('glAll').onclick=()=>{ closeSheet(); go('glossary'); }; }); }, true);
/* no pinch or double-tap zoom */
['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{ if(e.touches&&e.touches.length>1) e.preventDefault(); },{passive:false});
let _lastTap=0,_tx=0,_ty=0; document.addEventListener('touchstart',e=>{ const t=e.touches[0]; _tx=t.clientX; _ty=t.clientY; },{passive:true});
document.addEventListener('touchend',e=>{ const t=e.changedTouches[0]; if(Math.abs(t.clientX-_tx)>8||Math.abs(t.clientY-_ty)>8){ _lastTap=0; return; } const n=Date.now(); if(n-_lastTap<300 && !e.target.closest('input,textarea,label,button')) e.preventDefault(); _lastTap=n; },{passive:false});
route();
if(_resume){ const sv=store.get('sfw2.y',null); if(sv&&sv.id===_resume) requestAnimationFrame(()=>window.scrollTo(0,sv.y)); }

if('serviceWorker' in navigator){ window.addEventListener('load',()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }); }
</script>
</body>
</html>
